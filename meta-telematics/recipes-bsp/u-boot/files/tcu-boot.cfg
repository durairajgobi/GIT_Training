# Boot-time and attack-surface reductions for production units.
# -2: autoboot immediately, no key check (console cannot interrupt boot)
CONFIG_BOOTDELAY=-2
CONFIG_SILENT_CONSOLE=y
CONFIG_SYS_DEVICE_NULLDEV=y
# A/B rootfs selection with boot counter for OTA rollback
CONFIG_BOOTCOUNT_LIMIT=y
CONFIG_BOOTCOUNT_ENV=y
# Verified boot: FIT images signed with the fleet key (HAB covers SPL/U-Boot)
CONFIG_FIT_SIGNATURE=y
CONFIG_IMX_HAB=y
# Not needed on a TCU; trims boot time and code size
# CONFIG_CMD_NET is not set
# CONFIG_USB_GADGET is not set
