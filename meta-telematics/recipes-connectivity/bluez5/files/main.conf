# BlueZ policy for the TCU (single paired phone + head unit).
[General]
Name = TCU
Class = 0x200408
# Phone sees us quickly after ignition on
FastConnectable = true
# Re-pairing after the phone deleted us must not need a factory reset
JustWorksRepairing = confirm
# The HMI drives pairing; never be discoverable by default
DiscoverableTimeout = 180
PairableTimeout = 180
# Honour the remote's request to use secure connections
SecureConnections = on

[Policy]
# Short in-daemon retries for transient link loss; btmgr owns the longer
# ignition-aware policy so the two must not overlap for minutes.
ReconnectAttempts = 3
ReconnectIntervals = 1, 2, 4
AutoEnable = true
ResumeDelay = 2
