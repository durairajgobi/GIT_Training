# TCU distribution: Poky base, systemd, hardened defaults.
require conf/distro/poky.conf

DISTRO = "tcu"
DISTRO_NAME = "Telematics Control Unit Linux"
DISTRO_VERSION = "1.0"

INIT_MANAGER = "systemd"
DISTRO_FEATURES:append = " bluetooth wifi pam seccomp virtualization usrmerge"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl nfs zeroconf 3g"

# Security hardening flags for all target code
require conf/distro/include/security_flags.inc

# OpenSSH, never Dropbear; OpenSSL 3 is the only TLS stack on target
PREFERRED_PROVIDER_virtual/ssh-server ?= "openssh"
PACKAGECONFIG:append:pn-curl = " openssl"

# Production images contain no root password and no debug tweaks; the
# -dev image opts back in explicitly.
EXTRA_IMAGE_FEATURES = ""
