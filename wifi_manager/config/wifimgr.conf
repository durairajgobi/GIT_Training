# wifimgrd configuration. Lines are "key = value"; unknown keys are an error.
# All durations are in seconds.

interface = wlan0

# wpa_supplicant control interface directory (ctrl_interface=DIR=...).
wpa_ctrl_dir = /run/wpa_supplicant
# Where wifimgrd binds its reply sockets; wpa_supplicant must be able to
# write here (do not use a PrivateTmp /tmp).
wpa_client_dir = /run/wifimgr

control_socket = /run/wifimgr/wifimgr.sock
# Who may talk to wifimgrd. Read-only commands work for anyone who can open
# the socket; changes require root or the daemon's uid.
control_socket_mode = 0660

# Saved networks (contains secrets, written 0600). Must be on persistent,
# writable storage: on a read-only rootfs this is the data partition.
profiles = /var/lib/wifimgr/networks.conf

# DHCP client. {iface} is replaced by the interface name. The hook reports
# leases back with `wifictl dhcp-event`. Leave empty if addressing is done
# elsewhere; the address is then detected through netlink.
dhcp_command = udhcpc -f -R -t 4 -T 3 -A 10 -i {iface} -s /usr/libexec/wifimgr/udhcpc-hook
netlink = true

log_level = info
syslog = false

# ---- connection policy
autoconnect = true
min_rssi = -85               # dBm; ignore weaker BSSs
band_5ghz_bonus = 5          # dB credit for 5/6 GHz
scan_interval_min = 5        # backoff while no saved network is in range ...
scan_interval_max = 120      # ... doubling up to this
scan_timeout = 15
connect_timeout = 25         # association + key handshake (+ reassociation after link loss)
dhcp_timeout = 30
signal_poll_interval = 10
bgscan_interval = 180        # while connected, look for higher-priority networks; 0 = off
roam_rssi_threshold = -75    # below this, also consider switching SSID ...
roam_hysteresis = 10         # ... if a candidate is this many dB stronger
max_auth_failures = 3        # wrong key this often -> stop retrying until credentials change
blacklist_base = 10          # retry backoff after a failed attempt ...
blacklist_max = 300          # ... doubling up to this
