# wpa_supplicant configuration for use with wifimgrd
# (installed as /etc/wpa_supplicant/wpa_supplicant-wlan0.conf for
# wpa_supplicant@wlan0.service).
#
# Deliberately contains no networks: wifimgrd owns network selection and
# configures wpa_supplicant over the control interface. Saved networks live
# in /var/lib/wifimgr/networks.conf.

ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=0

# Regulatory domain: set per market at end-of-line (channels, Tx power).
country=DE

ap_scan=1

# Protected Management Frames where the AP supports them.
pmf=1
sae_pwe=2
