# Passenger hotspot SoftAP.
# WPA3 migration: transition mode (SAE + WPA2-PSK, PMF optional) so older
# phones keep working; set WPA3_ONLY in the fleet config to switch to
# wpa_key_mgmt=SAE with ieee80211w=2 once the fleet's client mix allows it.
interface=ap0
driver=nl80211
ctrl_interface=/run/hostapd
ssid=TRUCK-WIFI
utf8_ssid=1
country_code=DE
ieee80211d=1

hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
wmm_enabled=1

# Passengers cannot see each other
ap_isolate=1
max_num_sta=8

# --- security ---
wpa=2
wpa_key_mgmt=SAE WPA-PSK
rsn_pairwise=CCMP
ieee80211w=1
sae_require_mfp=1
sae_pwe=2
# Anti-clogging threshold protects the CPU from SAE commit floods
sae_anti_clogging_threshold=5
# Per-vehicle passphrase substituted at end-of-line provisioning; SAE
# uses the same passphrase when no sae_password is set.
wpa_passphrase=@HOTSPOT_PASSPHRASE@

# Faster roam-free reconnects after ignition cycles
disassoc_low_ack=1
ap_max_inactivity=600
