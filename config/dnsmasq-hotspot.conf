# DHCP + DNS for the passenger hotspot (ap0 only).
interface=ap0
bind-interfaces
except-interface=lo
dhcp-range=192.168.50.10,192.168.50.50,255.255.255.0,2h
dhcp-option=option:router,192.168.50.1
dhcp-option=option:dns-server,192.168.50.1
# RFC 8910: Captive-Portal API URI
dhcp-option=114,"http://192.168.50.1:8080/api/captive"
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
# Re-render the per-passenger nftables rules whenever a lease changes
dhcp-script=/usr/libexec/tcu-hotspot/lease-hook
# Upstream DNS learned from the LTE bearer, written by ltecm's netif hook
resolv-file=/run/tcu/resolv.wwan
