# SimpleChat configuration (Phase 3)
# Format: key = value     Lines starting with '#' are comments.
# Every key can be overridden by an environment variable named
# SIMPLECHAT_<KEY>, e.g.  SIMPLECHAT_BACKEND=claude ./simple_chat

# --- Identity & console -------------------------------------------
bot_name       = SimpleBot
user_prompt    = "You> "
bot_prompt     = "Bot> "

# --- Logging & history --------------------------------------------
log_file       = simplechat.log
log_enabled    = true
max_history    = 50
time_format    = %Y-%m-%d %H:%M:%S
fallback_reply = I'm not sure how to respond to that. Type 'help' to see what I can do.

# --- Reply backend: rules (offline) | claude ----------------------
backend        = rules

# --- Claude API (used when backend = claude) ----------------------
# The API key is NEVER stored here. Export it instead:
#   export ANTHROPIC_API_KEY=sk-ant-...
api_key_env     = ANTHROPIC_API_KEY
model           = claude-opus-5-5
max_tokens      = 16000
# low | medium | high | xhigh | max  (lower = faster and cheaper)
effort          = medium
# Let the API retry a refused request on a fallback model.
server_fallback = true
timeout_seconds = 600
system_prompt   = You are SimpleBot, a friendly and concise assistant in a terminal chat. Answer in plain text without Markdown.
