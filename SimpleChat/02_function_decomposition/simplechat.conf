# SimpleChat configuration (Phase 2)
# Format: key = value     Lines starting with '#' are comments.
# Any key can also be overridden with an environment variable,
# e.g. SIMPLECHAT_BOT_NAME=Ada ./simple_chat

bot_name       = SimpleBot
user_prompt    = "You> "
bot_prompt     = "Bot> "
log_file       = simplechat.log
log_enabled    = true
max_history    = 50
time_format    = %Y-%m-%d %H:%M:%S
fallback_reply = I'm not sure how to respond to that. Type 'help' to see what I can do.
