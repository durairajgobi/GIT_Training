<!-- D-Bus policy: lets members of the "bluetooth" group drive bluetoothd
     (adapter control, agent / GATT / advertisement registration) without root.
     bluetoothd's own policy (bluetooth.conf) already allows it to call back
     into our Agent1 / GattCharacteristic1 / LEAdvertisement1 objects.
     Install to /etc/dbus-1/system.d/ and reload dbus. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy group="bluetooth">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
