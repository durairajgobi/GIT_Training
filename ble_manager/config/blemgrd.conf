# blemgrd configuration. All keys are optional; values shown are defaults
# unless noted. Comments start with '#' or ';'.

[general]
log_level = info                  ; error | warn | info | debug

[adapter]
name = hci0
power_on = true                   ; power the controller on at start / after rfkill
# bus_address = unix:path=/run/dbus/system_bus_socket   ; default: system bus

[agent]
# IO capability announced when pairing. Headless units: NoInputNoOutput
# ("just works"). Empty disables the built-in agent.
capability = NoInputNoOutput
auto_accept = true                ; confirm numeric comparison / authorisation
passkey = 0                       ; answered to RequestPasskey (KeyboardOnly)

[connection]
timeout_ms = 15000                ; connect + GATT discovery budget
max_connections = 4
pause_scan_during_connect = true  ; required by many single-radio controllers
stale_device_timeout_ms = 120000  ; forget unmanaged devices not seen this long

[reconnect]
initial_delay_ms = 500
max_delay_ms = 30000
multiplier = 2.0
jitter = 0.2
max_attempts = 0                  ; 0 = forever

[peripheral]
# Exposes Device Information + a vendor telemetry service and advertises it.
enabled = false
name = TCU-BLE
notify_interval_ms = 5000

# One section per device to keep connected.
# [device AA:BB:CC:DD:EE:FF]
# auto_reconnect = true
# pair = true
# subscribe = 180d/2a37           ; heart rate measurement
# subscribe = 180f/2a19           ; battery level
