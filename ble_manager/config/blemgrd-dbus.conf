<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Allows the unprivileged blemgr service user to call bluetoothd. Calls from
     bluetoothd back into blemgrd (Agent1, LEAdvertisement1, GATT application)
     are already permitted by BlueZ's own bluetooth.conf. -->
<busconfig>
  <policy user="blemgr">
    <allow send_destination="org.bluez"/>
  </policy>
</busconfig>
